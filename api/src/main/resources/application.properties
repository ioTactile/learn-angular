spring.application.name=api

# Fichier local gitignoré (JWT_SECRET=...) — copier depuis .env.example
spring.config.import=optional:file:.env[.properties]

# JPA : le schéma est géré par Flyway, pas par Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Datasource locale (docker compose) — surchargée par Testcontainers en test
spring.datasource.url=jdbc:postgresql://localhost:5432/habits
spring.datasource.username=habits
spring.datasource.password=habits

# JWT — secret uniquement via env JWT_SECRET (ou api/.env), jamais commité
app.security.jwt.secret=${JWT_SECRET}
app.security.jwt.expiration-minutes=15
app.security.jwt.refresh-expiration-days=7

# Rate limit auth (login / register / refresh) par IP
app.security.rate-limit.auth.max-attempts=10
app.security.rate-limit.auth.window-seconds=60
