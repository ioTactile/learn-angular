spring.application.name=api

# JPA : le schéma est géré par Flyway, pas par Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Datasource locale (docker compose) — surchargée par Testcontainers en test
spring.datasource.url=jdbc:postgresql://localhost:5432/habits
spring.datasource.username=habits
spring.datasource.password=habits

# JWT — en vrai projet : variable d'environnement / secret manager
app.security.jwt.secret=change-me-to-a-very-long-secret-key-for-hs256-learning
app.security.jwt.expiration-minutes=60
