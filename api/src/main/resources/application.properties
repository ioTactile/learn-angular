spring.application.name=api

# Fichier local gitignoré — copier depuis .env.example
spring.config.import=optional:file:.env[.properties]

# JPA : le schéma est géré par Flyway, pas par Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Datasource locale (docker compose) — secrets via env, Testcontainers en test
spring.datasource.url=jdbc:postgresql://localhost:5432/habits
spring.datasource.username=${DB_USER:habits}
spring.datasource.password=${DB_PASSWORD}

# JWT — secret uniquement via env JWT_SECRET (ou api/.env)
app.security.jwt.secret=${JWT_SECRET}
app.security.jwt.expiration-minutes=15
app.security.jwt.refresh-expiration-days=7
app.security.jwt.issuer=learn-angular-api
app.security.jwt.audience=learn-angular-web
app.security.jwt.cookie-secure=false

# Rate limit auth (login / register / refresh) par IP
app.security.rate-limit.auth.max-attempts=10
app.security.rate-limit.auth.window-seconds=60

# Swagger / OpenAPI désactivés (réactiver localement si besoin)
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
