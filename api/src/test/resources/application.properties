# Secret de test uniquement — surcharge ${JWT_SECRET} / ${DB_PASSWORD}
app.security.jwt.secret=test-only-jwt-hs256-secret-key-32b-min
app.security.jwt.expiration-minutes=15
app.security.jwt.refresh-expiration-days=7
app.security.jwt.issuer=learn-angular-api
app.security.jwt.audience=learn-angular-web
app.security.jwt.cookie-secure=false

spring.datasource.password=unused-overridden-by-testcontainers

# Les IT enchaînent beaucoup de register/login : ne pas bloquer la suite
app.security.rate-limit.auth.max-attempts=10000
app.security.rate-limit.auth.window-seconds=60
